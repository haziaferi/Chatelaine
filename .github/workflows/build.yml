name: build

# Builds and tests the Gradle project (core, data, ui, Android and desktop apps). The Android SDK is
# preinstalled on the runner with ANDROID_HOME set, so no local.properties is needed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Robolectric fetches its Android runtime jars from Maven Central while the tests run,
      # outside Gradle's cache; kept here, a Maven Central refusal no longer fails the build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-
      - run: ./gradlew --no-daemon :core:desktopTest :data:desktopTest :data:testAndroidHostTest :ui:desktopTest :androidApp:testDebugUnitTest :desktopApp:test :androidApp:assembleDebug :desktopApp:jar
